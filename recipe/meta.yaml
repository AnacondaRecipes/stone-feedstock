{% set name = "stone" %}
{% set version = "3.5.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d1167cf3842fb8f700f6af3645c8b1878db7f91b954c7dfa54a8a2b84d3d4b5e

build:
  number: 0
  entry_points:
    - stone=stone.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<311]

requirements:
  host:
    - pip
    - python
    - setuptools >=77
    - setuptools-scm >=8,<9
  run:
    - python
    - ply >=3.4
    - packaging >=21.0
    - jinja2 >=3.0.3

# test_whitespace is skipped on windows because of `InvalidSpec('Indent is not divisible by 4.', 5, 'ns1.stone')`
{% set disabled_tests = " not test_whitespace" %}  # [win]
# E       PermissionError: [Errno 13] Permission denied: 'C:\\Users\\TASK_M~1\\AppData\\Local\\Temp\\tmp3m1vjiq7'
{% set disabled_tests = disabled_tests + " and not test_load_expected_output_manifest" %}  # [win]

test:
  source_files:
    - test
  imports:
    - stone
    - stone.backends
    - stone.backends.python_rsrc
    - stone.frontend
    - stone.ir
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - stone --help
    - pytest test -k {{ disabled_tests }}  # [win]
    - pytest test  # [not win]

about:
  home: https://www.dropbox.com/developers
  summary: Stone is an interface description language (IDL) for APIs.
  description: Stone is an interface description language (IDL) for APIs.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/dropbox/stone
  doc_url: https://github.com/dropbox/stone/tree/main/docs

extra:
  recipe-maintainers:
    - cjmartian
    - BastianZim
  skip-lints:
    - reachable_url
